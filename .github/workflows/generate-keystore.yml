
name: Generate Keystore (One-time)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate keystore + credentials
        run: |
          mkdir -p out
          STORE_PASSWORD=$(openssl rand -base64 18)
          KEY_PASSWORD=$(openssl rand -base64 18)
          KEY_ALIAS=upload

          keytool -genkeypair -v \
            -keystore out/my-release-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Leo, OU=Dev, O=GooseDeveloper, L=Singkawang, S=Kalbar, C=ID"

          base64 -w 0 out/my-release-key.jks > out/keystore_base64.txt

          {
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } > out/credentials.txt

          echo "File dibuat, cek bagian Artifacts di bawah halaman run ini setelah job selesai."
          echo "Jangan copy dari log ini - base64 terlalu panjang untuk log, download artifact-nya saja."

      - name: Upload keystore bundle
        uses: actions/upload-artifact@v4
        with:
          name: keystore-bundle
          path: out/
          retention-days: 1
