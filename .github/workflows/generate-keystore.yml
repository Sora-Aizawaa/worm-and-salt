name: Generate Keystore (One-time)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate keystore + credentials
        run: |
          STORE_PASSWORD=$(openssl rand -base64 18)
          KEY_PASSWORD=$(openssl rand -base64 18)
          KEY_ALIAS=upload

          keytool -genkeypair -v \
            -keystore my-release-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Leo, OU=Dev, O=GooseDeveloper, L=Singkawang, S=Kalbar, C=ID"

          KEYSTORE_BASE64=$(base64 -w 0 my-release-key.jks)

          echo "=========================================="
          echo "COPY 4 NILAI INI KE GITHUB SECRETS:"
          echo "=========================================="
          echo "KEY_ALIAS      = $KEY_ALIAS"
          echo "STORE_PASSWORD = $STORE_PASSWORD"
          echo "KEY_PASSWORD   = $KEY_PASSWORD"
          echo "------------------------------------------"
          echo "KEYSTORE_BASE64 (copy semua teks satu baris di bawah ini):"
          echo "$KEYSTORE_BASE64"
          echo "=========================================="
