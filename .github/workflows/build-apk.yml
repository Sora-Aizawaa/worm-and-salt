name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Generate Flutter Project Structure
        run: |
          flutter create --org com.soraaizawaa --project-name game_cacing_garam temp_app
          mv temp_app/android ./android
          rm -rf temp_app

      - name: Setup Keystore
        run: |
          cp release-keystore.p12 android/app/
          cat > android/key.properties <<EOF
          storePassword=password123
          keyPassword=password123
          keyAlias=my-key-alias
          storeFile=release-keystore.p12
          EOF

      # `flutter create` always regenerates android/app/build.gradle.kts from its
      # default template, and that template's release buildType still points at
      # signingConfigs.getByName("debug"). Decoding the keystore and writing
      # key.properties (previous two steps) does nothing on its own because
      # nothing in build.gradle.kts reads that file yet. This step wires the
      # generated build.gradle.kts to actually use the upload keystore, which is
      # the part that was missing and caused Amazon's "Android Debug
      # Certificate" rejection.
      - name: Configure release signing in build.gradle.kts
        run: |
          python3 - <<'PY'
          path = "android/app/build.gradle.kts"
          with open(path) as f:
              content = f.read()

          # 1. Load key.properties before the android {} block.
          keystore_loader = '''import java.util.Properties
          import java.io.FileInputStream

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          '''
          if "val keystoreProperties" not in content:
              content = keystore_loader + content

          # 2. Add a release signingConfigs entry right after "android {".
          signing_config_block = '''android {
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = keystoreProperties["storeFile"]?.let { file(it) }
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          '''
          if 'create("release")' not in content:
              content = content.replace("android {\n", signing_config_block, 1)

          # 3. Point the release buildType at the new signingConfig instead of debug.
          content = content.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")',
          )

          with open(path, "w") as f:
              f.write(content)

          assert 'create("release")' in content
          assert 'signingConfig = signingConfigs.getByName("release")' in content
          print("build.gradle.kts patched OK")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release Signed)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
