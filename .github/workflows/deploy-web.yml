name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Generate Flutter Project Structure
        run: |
          flutter create --org com.soraaizawaa --project-name game_cacing_garam temp_app
          mv temp_app/web ./web
          rm -rf temp_app
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Build Web App
        run: |
          # Ganti "REPO_NAME" dengan nama repository baru Anda jika berbeda
          REPO_NAME=$(echo ${{ github.repository }} | cut -d'/' -f2)
          flutter build web --base-href /$REPO_NAME/
        
      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
